name: Daily Market Data Pipeline

on:
  schedule:
    # Runs at 11:30 UTC every weekday (Monday-Friday)
    # This corresponds to 17:00 IST (5:00 PM), safely after the Indian market closes at 15:30 IST.
    - cron: '30 11 * * 1-5'
  workflow_dispatch:
    # Allows manual trigger from the GitHub Actions UI

jobs:
  sync_market_data:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip' # caching pip dependencies

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        cd backend
        pip install -r requirements.txt
        pip install yfinance psycopg2-binary SQLAlchemy

    - name: Run EOD Data Sync
      env:
        # Securely pass the Neon PostgreSQL URL from GitHub Secrets
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        cd backend
        python cron_sync.py
