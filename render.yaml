services:
  - type: web
    name: indalpha-backend
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      # To use a permanent PostgreSQL database instead of ephemeral SQLite, 
      # connect a PostgreSQL database on Render and it will automatically populate this variable.
      - key: DATABASE_URL
        sync: false

  - type: cron
    name: indalpha-daily-sync
    env: python
    plan: free
    schedule: "*/15 4-10 * * 1-5" # Runs every 15 mins from 4:00 AM to 10:59 AM UTC (9:30 AM - 4:30 PM IST) on weekdays
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python cron_sync.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        sync: false
