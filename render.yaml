services:
  - type: web
    name: indalpha-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      # To use a permanent PostgreSQL database instead of ephemeral SQLite, 
      # connect a PostgreSQL database on Render and it will automatically populate this variable.
      - key: DATABASE_URL
        sync: false
